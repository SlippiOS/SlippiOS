name: Build ISO

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/chromium
          sudo apt-get clean

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build SlippiOS ISO
        run: nix build .#nixosConfigurations.slippi-iso.config.system.build.isoImage

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: slippios-iso
          path: result/iso/*.iso
          if-no-files-found: error
          retention-days: 3

      - name: Keep only the newest 3 artifacts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts" --paginate \
            --jq '.artifacts[] | select(.expired == false) | [.id, .created_at] | @tsv' \
            | sort -k2 -r | tail -n +4 | cut -f1 \
            | while read -r id; do
                gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
              done
