name: Build ISO

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/chromium
          sudo apt-get clean

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build SlippiOS ISO
        run: nix build .#nixosConfigurations.slippi-iso.config.system.build.isoImage

      - name: Upload ISO
        id: upload
        run: |
          iso=$(find result/iso -maxdepth 1 -name '*.iso' -print -quit)
          name="slippios-${GITHUB_SHA::7}.iso"
          url=$(curl --fail --silent --show-error --retry 3 --retry-delay 5 \
                 --max-time 3600 --upload-file "$iso" \
                 "https://transfer.archivete.am/$name")
          test -n "$url"
          sha=$(sha256sum "$iso" | cut -d' ' -f1)
          size=$(du -h "$iso" | cut -f1)
          {
            echo "### SlippiOS ISO"
            echo ""
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Size: $size"
            echo "- SHA-256: \`$sha\`"
            echo "- Download: [$name]($url)"
            echo ""
            echo "Hosted on transfer.archivete.am (transfer.sh mirror); links expire."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "SHA256: $sha"
          echo "Download: $url"
