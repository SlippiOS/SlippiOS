name: Validate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "backend/**"
      - "flake.nix"
      - "flake.lock"
      - "modules/**"
      - "hosts/**"
      - "pkgs/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Test Go backend
        working-directory: backend
        run: nix shell --inputs-from . nixpkgs#go -c go test ./...

      - name: Validate Godot shell
        env:
          SLIPPIOS_PARSE_ONLY: "1"
        run: |
          nix shell --inputs-from . nixpkgs#godot_4 -c sh -c \
            'godot --headless --path apps/shell --import && godot --headless --path apps/shell --quit'
