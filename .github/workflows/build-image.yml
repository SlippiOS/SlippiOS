name: Build Image

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "os-*"

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The release step creates a GitHub release. This job only runs on tags
    # and manual dispatch, never on pull requests.
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/chromium
          sudo apt-get clean

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # systemd-repart builds the image in an unprivileged user namespace.
      # Ubuntu 24.04 restricts those by default, even on GitHub runners.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Validate shell project
        env:
          SLIPPIOS_PARSE_ONLY: "1"
        run: |
          nix shell --inputs-from . nixpkgs#godot_4 -c sh -c \
            'godot --headless --path apps/shell --import && godot --headless --path apps/shell --quit'

      - name: Measure system closure
        run: |
          toplevel=$(nix build --print-out-paths \
            .#nixosConfigurations.slippios-usb.config.system.build.toplevel)
          nix-store --query --requisites "$toplevel" \
            | xargs du -sm \
            | sort -n \
            | tail -40

      - name: Build USB image
        run: |
          nix build --print-build-logs \
            .#nixosConfigurations.slippios-usb.config.system.build.image \
            -o result-image
          nix build --print-build-logs \
            .#nixosConfigurations.slippios-usb.config.system.build.uki \
            -o result-uki

      - name: Inspect artifacts
        run: |
          set -euo pipefail
          image=$(find -L result-image -maxdepth 1 -name '*.raw.xz' \
            ! -name '*.nix-store.raw.xz' -print -quit)
          split=$(find -L result-image -maxdepth 1 -name '*.nix-store.raw.xz' -print -quit)
          uki=$(find -L result-uki -maxdepth 1 -name '*.efi' -print -quit)

          test -n "$image"
          test -n "$split"
          test -n "$uki"

          mkdir -p artifacts
          raw="artifacts/$(basename "${split%.xz}")"
          xz -d -T0 -c "$split" > "$raw"

          echo "image=$image"
          echo "raw=$raw"
          echo "uki=$uki"
          ls -lh "$image" "$raw" "$uki"

          image_bytes=$(stat -c '%s' "$image")
          raw_bytes=$(stat -c '%s' "$raw")
          uki_bytes=$(stat -c '%s' "$uki")
          limit=$((2 * 1024 * 1024 * 1024))

          {
            echo "### SlippiOS USB image"
            echo ""
            echo "- Version: \`$(nix eval --raw .#nixosConfigurations.slippios-usb.config.system.image.version)\`"
            echo "- Full image: \`$(basename "$image")\`: $((image_bytes / 1024 / 1024)) MiB"
            echo "- Store slot: \`$(basename "$raw")\`: $((raw_bytes / 1024 / 1024)) MiB"
            echo "- UKI: \`$(basename "$uki")\`: $((uki_bytes / 1024 / 1024)) MiB"
            echo ""
            if (( image_bytes >= limit )); then
              echo "> Full image is at or above GitHub's 2 GiB release-asset limit."
            else
              echo "> Full image fits under GitHub's 2 GiB release-asset limit."
            fi
            if (( raw_bytes >= limit )); then
              echo "> Store slot is at or above GitHub's 2 GiB release-asset limit."
            else
              echo "> Store slot fits under GitHub's 2 GiB release-asset limit."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          image=$(find -L result-image -maxdepth 1 -name '*.raw.xz' \
            ! -name '*.nix-store.raw.xz' -print -quit)
          raw=$(find artifacts -maxdepth 1 -name '*.nix-store.raw' -print -quit)
          uki=$(find -L result-uki -maxdepth 1 -name '*.efi' -print -quit)

          version=$(nix eval --raw .#nixosConfigurations.slippios-usb.config.system.image.version)
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="os-${version}-${GITHUB_RUN_ID}"
          fi

          raw_name=$(basename "$raw")
          uki_name=$(basename "$uki")
          full_name="slippios-usb-${version}.img.xz"

          mkdir -p release
          ln "$image" "release/$full_name" 2>/dev/null || cp "$image" "release/$full_name"
          ln "$raw" "release/$raw_name" 2>/dev/null || cp "$raw" "release/$raw_name"
          ln "$uki" "release/$uki_name" 2>/dev/null || cp "$uki" "release/$uki_name"

          # The .zsync asset contains only block checksums; zsync is given the
          # actual release URL at update time.
          nix shell nixpkgs#zsync -c zsyncmake \
            -o "release/${raw_name}.zsync" "release/${raw_name}"

          full_sha=$(sha256sum "release/$full_name" | cut -d' ' -f1)
          raw_sha=$(sha256sum "release/$raw_name" | cut -d' ' -f1)
          uki_sha=$(sha256sum "release/$uki_name" | cut -d' ' -f1)
          full_size=$(stat -c '%s' "release/$full_name")
          raw_size=$(stat -c '%s' "release/$raw_name")
          uki_size=$(stat -c '%s' "release/$uki_name")

          limit=$((2 * 1024 * 1024 * 1024))
          for size in "$full_size" "$raw_size"; do
            if (( size >= limit )); then
              echo "asset is at or above GitHub's 2 GiB limit" >&2
              exit 1
            fi
          done

          jq -n \
            --arg version "$version" \
            --arg tag "$tag" \
            --arg full_name "$full_name" \
            --arg full_sha "$full_sha" \
            --argjson full_size "$full_size" \
            --arg raw_name "$raw_name" \
            --arg raw_sha "$raw_sha" \
            --argjson raw_size "$raw_size" \
            --arg uki_name "$uki_name" \
            --arg uki_sha "$uki_sha" \
            --argjson uki_size "$uki_size" \
            '{
              version: $version,
              tag: $tag,
              full_image: { name: $full_name, sha256: $full_sha, size: $full_size },
              nix_store: {
                name: $raw_name,
                sha256: $raw_sha,
                size: $raw_size,
                zsync: ($raw_name + ".zsync")
              },
              uki: { name: $uki_name, sha256: $uki_sha, size: $uki_size }
            }' > release/manifest.json

          (cd release && sha256sum $(ls | grep -v '^SHA256SUMS$') > SHA256SUMS)

          gh release create "$tag" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "SlippiOS ${version}" \
            --notes "SlippiOS USB image ${version}.

          Flash \`${full_name}\` with Etcher, Rufus (DD mode), or \`dd\`. Boot with UEFI; Secure Boot must be off.

          The image contains an A/B system store and a growable \`SLIPPIOS\` data partition. Updates are installed in place from the console and never touch user data."

          gh release upload "$tag" release/* --clobber
          gh release edit "$tag" --draft=false --latest

          {
            echo ""
            echo "### Release"
            echo ""
            echo "- Tag: \`$tag\`"
            echo "- Image: [$full_name](https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag/$full_name)"
            echo "- Manifest: [manifest.json](https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/manifest.json)"
          } >> "$GITHUB_STEP_SUMMARY"
