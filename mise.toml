[tools]
jq = "latest"
go = "1.27"

[settings]
auto_install = true

[tasks."build:image"]
description = "Build the A/B USB image locally (uses nix-portable if Nix is absent)"
run = "./scripts/build-image"

[tasks."build:image-dev"]
description = "Build an uncompressed USB image for local boot testing"
run = "SLIPPI_DEV=1 ./scripts/build-image"

[tasks."run:image"]
description = "Boot the newest local USB image in QEMU/UEFI"
run = "./scripts/run-image"

[tasks."fetch:image"]
description = "Download and verify the newest published USB image"
run = "./scripts/fetch-image"

[tasks."test:shell"]
description = "Parse the Godot project headlessly"
run = "./scripts/nix shell --inputs-from . nixpkgs#godot_4 -c godot --headless --path apps/shell --quit"

[tasks.test]
description = "Run the fast checks"
depends = ["test:shell", "go:test"]

[tasks."go:build"]
description = "Build the Go control CLI and session fallback"
run = "cd backend && go build ./cmd/slippios ./cmd/slippios-session"

[tasks."go:test"]
description = "Run Go tests"
run = "cd backend && go test ./..."

[tasks."nix"]
description = "Open a Nix shell with the project's tools"
run = "./scripts/nix shell --inputs-from . nixpkgs#godot_4 nixpkgs#qemu nixpkgs#zsync nixpkgs#xz nixpkgs#jq"
