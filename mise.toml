[tools]
jq = "latest"
go = "1.27"

[settings]
auto_install = true

[tasks."build:image"]
description = "Build the A/B USB image locally (uses nix-portable if Nix is absent)"
run = "./scripts/build-image"

[tasks."dev:env"]
description = "Create or report the local development sandbox"
run = "./scripts/dev env"

[tasks."dev:cli"]
description = "Run the CLI against the local sandbox"
run = "./scripts/dev cli"

[tasks."dev:web"]
description = "Run the setup page against the local sandbox"
run = "./scripts/dev web"

[tasks."dev:ssh"]
description = "SSH into the running dev VM (password: slippios)"
run = "./scripts/dev ssh"

[tasks."dev:push"]
description = "Push the CLI and exported shell to the running dev VM"
run = "./scripts/dev push"

[tasks."dev:shell"]
description = "Run the exported Godot shell against the local sandbox"
run = "./scripts/dev shell"

[tasks."dev:iso"]
description = "Print the sandbox test ISO path"
run = "./scripts/dev iso"

[tasks."build:image-dev"]
description = "Build an uncompressed USB image for local boot testing"
run = "SLIPPI_DEV=1 ./scripts/build-image"

[tasks."run:image"]
description = "Boot the newest local USB image in QEMU/UEFI"
run = "./scripts/run-image"

[tasks."stop:image"]
description = "Power off the running QEMU guest cleanly"
run = "./scripts/stop-image"

[tasks.clean]
description = "Delete disposable cache and garbage-collect unreachable Nix paths"
run = "./scripts/clean-cache --all"

[tasks."clean:hard"]
description = "Wipe .cache and the entire nix-portable store (full re-download next time)"
run = "./scripts/clean-cache --hard"

[tasks."clean:cache"]
description = "Delete disposable QEMU overlays, test ISOs and build scratch from .cache"
run = "./scripts/clean-cache"

[tasks."clean:nix"]
description = "Garbage-collect unreachable paths from the Nix store"
run = "./scripts/nix store gc"

[tasks."fetch:image"]
description = "Download and verify the newest published USB image"
run = "./scripts/fetch-image"

[tasks."test:shell"]
description = "Parse the Godot project headlessly"
run = "./scripts/nix shell --inputs-from . nixpkgs#godot_4 -c sh -c 'export SLIPPIOS_PARSE_ONLY=1; godot --headless --path apps/shell --import && godot --headless --path apps/shell --quit'"

[tasks.test]
description = "Run the fast checks"
depends = ["test:shell", "go:test"]

[tasks."go:build"]
description = "Build the Go control CLI and session fallback"
run = "mkdir -p .cache/bin && cd backend && go build -o ../.cache/bin/slippios ./cmd/slippios && go build -o ../.cache/bin/slippios-session ./cmd/slippios-session"

[tasks."go:test"]
description = "Run Go tests"
run = "cd backend && go test ./..."

[tasks."nix"]
description = "Open a Nix shell with the project's tools"
run = "./scripts/nix shell --inputs-from . nixpkgs#godot_4 nixpkgs#qemu nixpkgs#zsync nixpkgs#xz nixpkgs#jq"
